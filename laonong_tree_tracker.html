<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老农种树 · 图鉴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap');

  :root {
    --ink: #2a1f14;
    --bark: #6b4c2a;
    --moss: #4a7c59;
    --leaf: #7ab648;
    --blossom: #e8a0a0;
    --sky: #c8e0f0;
    --parchment: #f5efe6;
    --cream: #fdf8f0;
    --stone: #9e8e7a;
    --gold: #c9a84c;
    --rare: #8b5e9e;
    --rare-light: #e8d8f5;
    --done-bg: #e8f5e2;
    --done-border: #7ab648;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--cream);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(122,182,72,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(200,224,240,0.15) 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Noto Serif SC', serif;
    color: var(--ink);
    padding: 0 0 60px;
  }

  header {
    text-align: center;
    padding: 36px 20px 24px;
    border-bottom: 1px solid rgba(107,76,42,0.15);
    background: linear-gradient(180deg, rgba(245,239,230,0) 0%, rgba(245,239,230,0.8) 100%);
    position: relative;
  }

  header::before {
    content: '🌿';
    position: absolute;
    left: 24px; top: 32px;
    font-size: 28px;
    opacity: 0.4;
  }
  header::after {
    content: '🌸';
    position: absolute;
    right: 24px; top: 32px;
    font-size: 28px;
    opacity: 0.4;
  }

  h1 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: clamp(26px, 5vw, 40px);
    color: var(--bark);
    letter-spacing: 4px;
    line-height: 1.2;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 13px;
    color: var(--stone);
    letter-spacing: 1px;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-num {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 26px;
    color: var(--moss);
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    color: var(--stone);
    letter-spacing: 1px;
  }

  .progress-wrap {
    width: min(320px, 80vw);
    margin: 16px auto 0;
    background: rgba(107,76,42,0.1);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--moss), var(--leaf));
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 20px 16px 0;
  }

  .filter-btn {
    padding: 6px 16px;
    border-radius: 99px;
    border: 1.5px solid rgba(107,76,42,0.2);
    background: transparent;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--stone);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover { border-color: var(--moss); color: var(--moss); }
  .filter-btn.active {
    background: var(--moss);
    border-color: var(--moss);
    color: white;
  }
  .filter-btn.rare-filter.active { background: var(--rare); border-color: var(--rare); }

  .season-section {
    margin: 28px auto 0;
    max-width: 900px;
    padding: 0 16px;
  }

  .season-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(107,76,42,0.12);
  }

  .season-icon { font-size: 20px; }

  .season-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 20px;
    color: var(--bark);
    letter-spacing: 2px;
  }

  .season-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--stone);
  }

  .tree-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
  }

  .tree-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 12px 6px 10px;
    border-radius: 12px;
    border: 1.5px solid rgba(107,76,42,0.12);
    background: white;
    cursor: pointer;
    transition: all 0.22s ease;
    position: relative;
    user-select: none;
  }

  .tree-card:hover {
    border-color: var(--moss);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(74,124,89,0.12);
  }

  .tree-card.done {
    background: var(--done-bg);
    border-color: var(--done-border);
  }

  .tree-card.rare {
    border-color: rgba(139,94,158,0.3);
  }
  .tree-card.rare:hover { border-color: var(--rare); }
  .tree-card.rare.done { background: var(--rare-light); border-color: var(--rare); }

  .tree-card.hidden { display: none; }

  .tree-emoji {
    font-size: 26px;
    line-height: 1;
    transition: transform 0.2s;
  }
  .tree-card:hover .tree-emoji { transform: scale(1.15); }
  .tree-card.done .tree-emoji { filter: drop-shadow(0 0 4px rgba(122,182,72,0.5)); }

  .tree-name {
    font-size: 13px;
    text-align: center;
    color: var(--ink);
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  .rare-badge {
    position: absolute;
    top: 5px; right: 5px;
    background: var(--rare);
    color: white;
    font-size: 8px;
    padding: 1px 4px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    font-family: sans-serif;
  }

  .check-mark {
    position: absolute;
    top: 5px; left: 5px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--moss);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: scale(0);
    transition: all 0.2s;
    font-size: 11px;
    color: white;
  }
  .tree-card.done .check-mark { opacity: 1; transform: scale(1); }

  .btn-reset {
    display: block;
    margin: 32px auto 0;
    padding: 8px 22px;
    border-radius: 99px;
    border: 1.5px solid rgba(107,76,42,0.2);
    background: transparent;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--stone);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { border-color: #c0392b; color: #c0392b; }
</style>
</head>
<body>

<header>
  <h1>老农种树 · 图鉴收集</h1>
  <p class="subtitle">点击树种标记已种植 · 数据保存在本地浏览器</p>
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="done-count">0</span>
      <span class="stat-label">已种植</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="total-count">41</span>
      <span class="stat-label">总树种</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="rare-done-count">0</span>
      <span class="stat-label">珍稀已得</span>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
</header>

<div class="controls">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="spring">🌸 春</button>
  <button class="filter-btn" data-filter="summer">☀️ 夏</button>
  <button class="filter-btn" data-filter="autumn">🍂 秋</button>
  <button class="filter-btn" data-filter="winter">❄️ 冬</button>
  <button class="filter-btn rare-filter" data-filter="rare">✨ 珍稀</button>
  <button class="filter-btn" data-filter="done">✅ 已种</button>
  <button class="filter-btn" data-filter="undone">🌱 未种</button>
</div>

<div id="tree-container"></div>

<button class="btn-reset" id="btn-reset">重置记录</button>

<script>
const SEASONS = [
  {
    id: 'spring', label: '春季', icon: '🌸',
    trees: [
      { name: '李',       emoji: '🌿' },
      { name: '樱桃',     emoji: '🍒' },
      { name: '桃',       emoji: '🍑' },
      { name: '杏',       emoji: '🌼' },
      { name: '梅',       emoji: '🌸' },
      { name: '海棠',     emoji: '🌺' },
      { name: '杜梨',     emoji: '🤍' },
      { name: '木棉',     emoji: '🔴' },
      { name: '玉兰',     emoji: '🪷' },
      { name: '蓝花楹',   emoji: '💜' },
      { name: '白氏喃喃果', emoji: '⭐', rare: true },
    ]
  },
  {
    id: 'summer', label: '夏季', icon: '☀️',
    trees: [
      { name: '桑',         emoji: '🫐' },
      { name: '山杨',       emoji: '🌳' },
      { name: '槐',         emoji: '🍃' },
      { name: '合欢',       emoji: '🌸' },
      { name: '水杉',       emoji: '🌲', rare: true },
      { name: '榕',         emoji: '🌴' },
      { name: '梧桐',       emoji: '🌿' },
      { name: '榆',         emoji: '🍀' },
      { name: '枫杨',       emoji: '🌾' },
      { name: '普陀鹅耳枥', emoji: '✨', rare: true },
      { name: '凤凰木',     emoji: '🔥' },
    ]
  },
  {
    id: 'autumn', label: '秋季', icon: '🍂',
    trees: [
      { name: '柚',     emoji: '🍋' },
      { name: '木樨',   emoji: '🟡' },
      { name: '元宝槭', emoji: '🍁' },
      { name: '胡桃',   emoji: '🫘' },
      { name: '银杏',   emoji: '💛', rare: true },
      { name: '栗',     emoji: '🌰' },
      { name: '乌桕',   emoji: '🔴' },
      { name: '栾',     emoji: '🌿' },
      { name: '连香树', emoji: '🍂', rare: true },
      { name: '鹅掌楸', emoji: '🌙', rare: true },
    ]
  },
  {
    id: 'winter', label: '冬季', icon: '❄️',
    trees: [
      { name: '樟',   emoji: '🌿' },
      { name: '楝',   emoji: '🟣' },
      { name: '侧柏', emoji: '🌲' },
      { name: '枇杷', emoji: '🍊' },
      { name: '华盖木', emoji: '🌸', rare: true },
      { name: '柿',   emoji: '🟠' },
      { name: '雪松', emoji: '❄️' },
      { name: '圆柏', emoji: '🟢' },
      { name: '油松', emoji: '🌲' },
      { name: '台湾杉', emoji: '⬆️', rare: true },
      { name: '山茶花', emoji: '🌺' },
    ]
  }
];

const STORAGE_KEY = 'laonong_done_trees';
let done = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let currentFilter = 'all';

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...done]));
}

function getTreeKey(season, name) { return season + ':' + name; }

function updateStats() {
  let total = 0, doneCount = 0, rareDone = 0;
  SEASONS.forEach(function(s) {
    s.trees.forEach(function(t) {
      total++;
      var key = getTreeKey(s.id, t.name);
      if (done.has(key)) {
        doneCount++;
        if (t.rare) rareDone++;
      }
    });
  });
  document.getElementById('done-count').textContent = doneCount;
  document.getElementById('total-count').textContent = total;
  document.getElementById('rare-done-count').textContent = rareDone;
  document.getElementById('progress-bar').style.width = (doneCount / total * 100).toFixed(1) + '%';
}

function matchesFilter(seasonId, tree, key) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'spring')  return seasonId === 'spring';
  if (currentFilter === 'summer')  return seasonId === 'summer';
  if (currentFilter === 'autumn')  return seasonId === 'autumn';
  if (currentFilter === 'winter')  return seasonId === 'winter';
  if (currentFilter === 'rare')    return !!tree.rare;
  if (currentFilter === 'done')    return done.has(key);
  if (currentFilter === 'undone')  return !done.has(key);
  return true;
}

function render() {
  var container = document.getElementById('tree-container');
  container.innerHTML = '';

  SEASONS.forEach(function(season) {
    var visibleTrees = season.trees.filter(function(t) {
      return matchesFilter(season.id, t, getTreeKey(season.id, t.name));
    });
    if (visibleTrees.length === 0) return;

    var doneSeason = season.trees.filter(function(t) {
      return done.has(getTreeKey(season.id, t.name));
    }).length;

    var section = document.createElement('div');
    section.className = 'season-section';
    section.innerHTML =
      '<div class="season-header">' +
        '<span class="season-icon">' + season.icon + '</span>' +
        '<span class="season-title">' + season.label + '</span>' +
        '<span class="season-count" id="count-' + season.id + '">' + doneSeason + ' / ' + season.trees.length + '</span>' +
      '</div>' +
      '<div class="tree-grid" id="grid-' + season.id + '"></div>';
    container.appendChild(section);

    var grid = document.getElementById('grid-' + season.id);

    season.trees.forEach(function(tree) {
      var key = getTreeKey(season.id, tree.name);
      var isDone = done.has(key);
      var visible = matchesFilter(season.id, tree, key);

      var card = document.createElement('div');
      var classes = 'tree-card';
      if (isDone)   classes += ' done';
      if (tree.rare) classes += ' rare';
      if (!visible)  classes += ' hidden';
      card.className = classes;

      card.innerHTML =
        '<div class="check-mark">✓</div>' +
        (tree.rare ? '<span class="rare-badge">珍稀</span>' : '') +
        '<div class="tree-emoji">' + tree.emoji + '</div>' +
        '<div class="tree-name">' + tree.name + '</div>';

      card.addEventListener('click', (function(s, t, k, c) {
        return function() {
          if (done.has(k)) { done.delete(k); c.classList.remove('done'); }
          else              { done.add(k);    c.classList.add('done'); }
          save();
          updateStats();
          var ds = s.trees.filter(function(x) { return done.has(getTreeKey(s.id, x.name)); }).length;
          var el = document.getElementById('count-' + s.id);
          if (el) el.textContent = ds + ' / ' + s.trees.length;
          if (currentFilter === 'done' || currentFilter === 'undone') {
            c.classList.toggle('hidden', currentFilter === 'done' ? !done.has(k) : done.has(k));
          }
        };
      })(season, tree, key, card));

      grid.appendChild(card);
    });
  });
}

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('btn-reset').addEventListener('click', function() {
  if (confirm('确定清空所有种植记录吗？')) {
    done.clear();
    save();
    updateStats();
    render();
  }
});

updateStats();
render();
</script>
</body>
</html>
